<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171923">
  <title>Wordly</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="loading-screen" class="screen loading-screen">
    <div class="brand">Wordly</div>
    <p id="loading-message">バージョン情報を確認しています...</p>
    <div class="progress-track"><div id="loading-progress"></div></div>
    <p id="loading-detail" class="muted">起動準備中</p>
  </main>

  <main id="error-screen" class="screen hidden">
    <div class="panel error-panel">
      <h1>起動できませんでした</h1>
      <p id="error-message"></p>
      <p class="muted">data/versions.json と各バージョンのJSONファイルを確認してください。</p>
      <button onclick="location.reload()">再読み込み</button>
    </div>
  </main>

  <main id="app" class="hidden">
    <header class="topbar">
      <button class="brand-button" data-view="home">Wordly</button>
      <div class="topbar-right"><span id="header-version" class="version"></span></div>
    </header>

    <section id="home-view" class="view">
      <div class="hero">
        <p class="eyebrow">ENGLISH VOCABULARY</p>
        <h1>Wordly</h1>
        <p class="muted">単語を覚えて、知識を積み重ねよう。</p>
      </div>
      <div class="mode-grid">
        <button class="mode-card" data-view="words">
          <span class="mode-icon">Aa</span><strong>単語帳</strong>
          <span class="muted">カードをめくって単語を覚える</span>
        </button>
        <button class="mode-card" data-view="quiz">
          <span class="mode-icon">?</span><strong>クイズ</strong>
          <span class="muted">覚えた単語を四択で確認する</span>
        </button>
      </div>
      <footer class="home-footer">Wordly <span id="home-version"></span></footer>
    </section>

    <section id="words-view" class="view hidden">
      <div class="section-heading">
        <div><p class="eyebrow">VOCABULARY</p><h1>単語帳</h1></div>
        <button class="subtle-button" data-view="home">ホームへ</button>
      </div>
      <div class="word-tools">
        <input id="word-search" type="search" placeholder="単語・意味を検索">
        <span id="word-total" class="muted"></span>
      </div>
      <div class="flashcard-area">
        <button id="flashcard" class="flashcard" type="button" aria-label="カードを裏返す">
          <span class="card-face card-front">
            <span class="card-label">ENGLISH</span>
            <strong id="card-word">abandon</strong>
            <span id="card-pronunciation" class="pronunciation"></span>
            <span id="card-pos" class="part-of-speech"></span>
            <span class="flip-hint">カードをクリックして裏返す</span>
          </span>
          <span class="card-face card-back">
            <span class="card-label">JAPANESE</span>
            <strong id="card-meaning"></strong>
            <span id="card-back-pos" class="part-of-speech"></span>
            <span class="flip-hint">クリックして表に戻す</span>
          </span>
        </button>
        <div class="card-counter" id="card-counter">1 / 10</div>
        <div class="card-navigation">
          <button id="previous-word" class="secondary-button">← 前へ</button>
          <button id="next-word" class="primary-button">次へ →</button>
        </div>
        <div class="card-progress"><div id="card-progress-bar"></div></div>
      </div>
    </section>

    <section id="quiz-view" class="view hidden">
      <div class="section-heading">
        <div><p class="eyebrow">QUIZ</p><h1>クイズ</h1></div>
        <button class="subtle-button" data-view="home">ホームへ</button>
      </div>
      <div id="quiz-setup" class="panel quiz-setup">
        <label>出題方向
          <select id="quiz-direction">
            <option value="en-ja">英語 → 日本語</option>
            <option value="ja-en">日本語 → 英語</option>
          </select>
        </label>
        <label>問題数
          <select id="quiz-count">
            <option value="5">5問</option>
            <option value="10" selected>10問</option>
            <option value="20">20問</option>
            <option value="all">全問</option>
          </select>
        </label>
        <button id="start-quiz" class="primary-button">クイズ開始</button>
      </div>
      <div id="quiz-playing" class="panel hidden">
        <div class="quiz-meta"><span id="quiz-progress">1 / 10</span><span id="quiz-score">正解 0</span></div>
        <h2 id="quiz-question"></h2>
        <div id="quiz-choices" class="choices"></div>
        <p id="quiz-feedback" class="quiz-feedback"></p>
        <button id="quiz-next" class="primary-button hidden">次の問題</button>
      </div>
      <div id="quiz-result" class="panel hidden">
        <p class="eyebrow">RESULT</p><h2>クイズ終了！</h2>
        <div class="result-score" id="result-score"></div>
        <p id="result-detail" class="muted"></p>
        <button id="retry-quiz" class="primary-button">もう一度挑戦</button>
      </div>
    </section>
  </main>
  <script src="js/words.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
